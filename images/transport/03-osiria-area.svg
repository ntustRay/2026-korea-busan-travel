<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">奧西利亞站、Skyline Luge、Brick Campus 與 Outlet 交通示意圖</title>
  <desc id="desc">從奧西利亞站搭短程計程車到 Skyline Luge，再前往 Maison Dongbusan 的 Brick Campus 與 Outlet，購物後搭計程車回車站。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#334155"/></marker>
    <style>.title{font:700 32px Arial,'Noto Sans TC',sans-serif;fill:#0f172a}.sub{font:500 18px Arial,'Noto Sans TC',sans-serif;fill:#475569}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:18}.label{font:700 21px Arial,'Noto Sans TC',sans-serif;fill:#0f172a}.small{font:500 16px Arial,'Noto Sans TC',sans-serif;fill:#475569}.arrow{stroke:#334155;stroke-width:4;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="560" fill="#f8fafc"/>
  <text x="60" y="58" class="title">Osiria｜Luge → Brick Campus → Outlet</text>
  <text x="60" y="92" class="sub">8 月炎熱：站與景點之間搭短程 Taxi；Outlet 最晚 18:00 離開</text>

  <rect x="50" y="175" width="230" height="150" class="box"/>
  <circle cx="95" cy="218" r="15" fill="#2563eb"/>
  <text x="175" y="224" text-anchor="middle" class="label">奧西利亞站</text>
  <text x="165" y="260" text-anchor="middle" class="small">오시리아역 1번 출구</text>
  <text x="165" y="292" text-anchor="middle" class="small">找 Taxi 乘車處</text>

  <path d="M280 250 H405" class="arrow"/>
  <text x="342" y="222" text-anchor="middle" class="small">Taxi 5–10 分鐘</text>

  <rect x="410" y="155" width="250" height="185" fill="#ecfdf5" stroke="#4ade80" stroke-width="2" rx="18"/>
  <text x="535" y="205" text-anchor="middle" class="label">Skyline Luge</text>
  <text x="535" y="244" text-anchor="middle" class="small">스카이라인 루지 부산</text>
  <text x="535" y="278" text-anchor="middle" class="small">10:00～12:00</text>
  <text x="535" y="310" text-anchor="middle" class="small">BIG 5｜A 組</text>

  <path d="M660 250 H785" class="arrow"/>
  <text x="722" y="222" text-anchor="middle" class="small">Taxi 約 5 分鐘</text>

  <rect x="790" y="125" width="360" height="245" fill="#fff7ed" stroke="#fb923c" stroke-width="2" rx="18"/>
  <text x="970" y="173" text-anchor="middle" class="label">Maison Dongbusan／Outlet</text>
  <text x="970" y="212" text-anchor="middle" class="small">롯데몰 메종동부산</text>
  <rect x="830" y="235" width="280" height="55" fill="#eef2ff" stroke="#818cf8" stroke-width="2" rx="12"/>
  <text x="970" y="270" text-anchor="middle" class="label">Brick Campus｜13:15～14:45</text>
  <text x="970" y="325" text-anchor="middle" class="label">Outlet｜15:00～18:00</text>
  <text x="970" y="352" text-anchor="middle" class="small">購物後叫 Taxi 回車站</text>

  <path d="M920 370 C760 505 370 500 220 325" class="arrow"/>
  <text x="570" y="485" text-anchor="middle" class="label">有戰利品時不要步行｜Taxi 回 오시리아역</text>

  <rect x="50" y="385" width="360" height="82" fill="#eff6ff" stroke="#60a5fa" stroke-width="2" rx="14"/>
  <text x="230" y="420" text-anchor="middle" class="small">去 Luge：스카이라인 루지 부산</text>
  <text x="230" y="449" text-anchor="middle" class="small">去 Maison：롯데몰 메종동부산</text>
</svg>
