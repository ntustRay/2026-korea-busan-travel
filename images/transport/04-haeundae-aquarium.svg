<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">海雲台晴天與雨天路線示意圖</title>
  <desc id="desc">晴天由中洞站前往 BUSAN X the SKY，再到海雲台海灘與傳統市場；雨天由海雲台站前往 SEA LIFE 水族館。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#334155"/></marker>
    <style>.title{font:700 32px Arial,'Noto Sans TC',sans-serif;fill:#0f172a}.sub{font:500 18px Arial,'Noto Sans TC',sans-serif;fill:#475569}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:18}.label{font:700 21px Arial,'Noto Sans TC',sans-serif;fill:#0f172a}.small{font:500 16px Arial,'Noto Sans TC',sans-serif;fill:#475569}.arrow{stroke:#334155;stroke-width:4;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="560" fill="#f8fafc"/>
  <text x="60" y="58" class="title">海雲台｜晴天 X the SKY・雨天 SEA LIFE</text>
  <text x="60" y="92" class="sub">晴天看高空海景；雨天改水族館。兩版最後都到 해운대역 前往 SPA LAND</text>

  <text x="60" y="145" class="label">晴天</text>
  <rect x="60" y="165" width="210" height="125" class="box"/>
  <circle cx="100" cy="205" r="14" fill="#16a34a"/>
  <text x="170" y="212" text-anchor="middle" class="label">中洞站</text>
  <text x="165" y="248" text-anchor="middle" class="small">중동역</text>
  <text x="165" y="274" text-anchor="middle" class="small">步行或短程 Taxi</text>

  <path d="M270 228 H365" class="arrow"/>
  <rect x="370" y="155" width="250" height="145" fill="#eef2ff" stroke="#818cf8" stroke-width="2" rx="18"/>
  <text x="495" y="200" text-anchor="middle" class="label">BUSAN X the SKY</text>
  <text x="495" y="238" text-anchor="middle" class="small">부산엑스더스카이</text>
  <text x="495" y="270" text-anchor="middle" class="small">10:30～12:00｜BIG 5 A</text>

  <path d="M620 228 H715" class="arrow"/>
  <rect x="720" y="155" width="190" height="145" fill="#dbeafe" stroke="#60a5fa" stroke-width="2" rx="18"/>
  <text x="815" y="205" text-anchor="middle" class="label">海雲台海灘</text>
  <text x="815" y="243" text-anchor="middle" class="small">해운대해수욕장</text>
  <text x="815" y="274" text-anchor="middle" class="small">短暫散步</text>

  <path d="M910 228 H995" class="arrow"/>
  <rect x="1000" y="155" width="155" height="145" fill="#fff7ed" stroke="#fb923c" stroke-width="2" rx="18"/>
  <text x="1077" y="202" text-anchor="middle" class="label">傳統市場</text>
  <text x="1077" y="240" text-anchor="middle" class="small">해운대전통시장</text>
  <text x="1077" y="272" text-anchor="middle" class="small">午餐</text>

  <text x="60" y="365" class="label">雨天</text>
  <rect x="60" y="385" width="210" height="120" class="box"/>
  <circle cx="100" cy="425" r="14" fill="#16a34a"/>
  <text x="170" y="432" text-anchor="middle" class="label">海雲台站</text>
  <text x="165" y="468" text-anchor="middle" class="small">해운대역 3／5 號出口</text>

  <path d="M270 445 H430" class="arrow"/>
  <text x="350" y="418" text-anchor="middle" class="small">往海邊步行約 10 分鐘</text>
  <rect x="435" y="375" width="260" height="140" fill="#ecfeff" stroke="#22d3ee" stroke-width="2" rx="18"/>
  <text x="565" y="420" text-anchor="middle" class="label">SEA LIFE Busan</text>
  <text x="565" y="458" text-anchor="middle" class="small">씨라이프 부산 아쿠아리움</text>
  <text x="565" y="490" text-anchor="middle" class="small">10:30～12:30</text>

  <path d="M695 445 H870" class="arrow"/>
  <rect x="875" y="385" width="280" height="120" fill="#ecfdf5" stroke="#4ade80" stroke-width="2" rx="18"/>
  <text x="1015" y="430" text-anchor="middle" class="label">回海雲台站</text>
  <text x="1015" y="468" text-anchor="middle" class="small">Line 2 → 센텀시티역</text>
</svg>
