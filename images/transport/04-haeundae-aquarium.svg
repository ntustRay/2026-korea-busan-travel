<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 680" role="img" aria-labelledby="title desc">
  <title id="title">釜山站到海雲台晴天與雨天景點完整路線</title>
  <desc id="desc">從釜山站搭一號線往老圃方向到西面，轉二號線往萇山方向；晴天到中洞站前往 BUSAN X the SKY，雨天到海雲台站前往 SEA LIFE 水族館。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#334155"/></marker>
    <style>.title{font:700 32px Arial,'Noto Sans TC',sans-serif;fill:#0f172a}.sub{font:500 18px Arial,'Noto Sans TC',sans-serif;fill:#475569}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:18}.label{font:700 20px Arial,'Noto Sans TC',sans-serif;fill:#0f172a}.small{font:500 15px Arial,'Noto Sans TC',sans-serif;fill:#475569}.arrow{stroke:#334155;stroke-width:4;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1400" height="680" fill="#f8fafc"/>
  <text x="55" y="55" class="title">Day 3｜釜山站 → 西面轉乘 → 海雲台</text>
  <text x="55" y="88" class="sub">共同走法：Line 1 到西面，轉 Line 2 往 장산；晴天中洞下車、雨天海雲台下車</text>

  <rect x="45" y="135" width="210" height="140" fill="#fff7ed" stroke="#fb923c" stroke-width="2" rx="18"/>
  <circle cx="85" cy="175" r="14" fill="#f97316"/>
  <text x="160" y="182" text-anchor="middle" class="label">釜山站</text>
  <text x="150" y="218" text-anchor="middle" class="small">부산역</text>
  <text x="150" y="248" text-anchor="middle" class="small">Line 1 往 노포</text>

  <path d="M255 205 H365" class="arrow"/>
  <text x="310" y="177" text-anchor="middle" class="small">約 10 分鐘</text>

  <rect x="370" y="120" width="245" height="170" class="box"/>
  <circle cx="412" cy="162" r="14" fill="#f97316"/>
  <circle cx="447" cy="162" r="14" fill="#16a34a"/>
  <text x="515" y="170" text-anchor="middle" class="label">西面站</text>
  <text x="492" y="207" text-anchor="middle" class="small">서면역</text>
  <text x="492" y="240" text-anchor="middle" class="small">轉 Line 2 往 장산</text>
  <text x="492" y="270" text-anchor="middle" class="small">不要搭往 양산</text>

  <path d="M615 205 H760" class="arrow"/>
  <text x="687" y="165" text-anchor="middle" class="small">Line 2 約 30～35 分鐘</text>
  <text x="687" y="190" text-anchor="middle" class="small">依天氣選下車站</text>

  <rect x="765" y="120" width="250" height="170" fill="#eff6ff" stroke="#60a5fa" stroke-width="2" rx="18"/>
  <text x="890" y="165" text-anchor="middle" class="label">晴天：中洞站</text>
  <text x="890" y="203" text-anchor="middle" class="small">중동역</text>
  <text x="890" y="238" text-anchor="middle" class="small">步行或短程 Taxi</text>
  <text x="890" y="268" text-anchor="middle" class="small">到 BUSAN X the SKY</text>

  <path d="M1015 205 H1115" class="arrow"/>
  <rect x="1120" y="120" width="235" height="170" fill="#eef2ff" stroke="#818cf8" stroke-width="2" rx="18"/>
  <text x="1237" y="165" text-anchor="middle" class="label">BUSAN X the SKY</text>
  <text x="1237" y="203" text-anchor="middle" class="small">부산엑스더스카이</text>
  <text x="1237" y="238" text-anchor="middle" class="small">10:30～12:00</text>
  <text x="1237" y="268" text-anchor="middle" class="small">BIG 5｜A 組</text>

  <path d="M1237 290 V375" class="arrow"/>
  <rect x="1070" y="380" width="285" height="170" fill="#dbeafe" stroke="#60a5fa" stroke-width="2" rx="18"/>
  <text x="1212" y="425" text-anchor="middle" class="label">海灘＋傳統市場</text>
  <text x="1212" y="463" text-anchor="middle" class="small">해운대해수욕장</text>
  <text x="1212" y="495" text-anchor="middle" class="small">해운대전통시장</text>
  <text x="1212" y="525" text-anchor="middle" class="small">最後走到 해운대역</text>

  <path d="M765 230 C690 330 690 440 765 485" class="arrow"/>
  <rect x="765" y="400" width="250" height="170" fill="#ecfeff" stroke="#22d3ee" stroke-width="2" rx="18"/>
  <text x="890" y="445" text-anchor="middle" class="label">雨天：海雲台站</text>
  <text x="890" y="483" text-anchor="middle" class="small">해운대역 3／5 號出口</text>
  <text x="890" y="518" text-anchor="middle" class="small">往海邊步行約 10 分鐘</text>
  <text x="890" y="548" text-anchor="middle" class="small">SEA LIFE Busan</text>


  <rect x="45" y="360" width="590" height="180" fill="#ecfdf5" stroke="#4ade80" stroke-width="2" rx="16"/>
  <text x="70" y="405" class="label">下一段：前往 SPA LAND</text>
  <text x="70" y="445" class="small">晴天：海灘／市場 → 해운대역</text>
  <text x="70" y="480" class="small">雨天：SEA LIFE → 原路回 해운대역</text>
  <text x="70" y="515" class="small">共同：해운대역 Line 2 往 양산 → 센텀시티역</text>

  <rect x="45" y="585" width="1310" height="58" fill="#fff7ed" stroke="#fdba74" stroke-width="2" rx="14"/>
  <text x="700" y="621" text-anchor="middle" class="label">重點：釜山站往海雲台時，西面轉 Line 2 要看 장산；前往 SPA 時才改看 양산。</text>
</svg>
